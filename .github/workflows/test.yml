name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate public repository
        run: ./tests/test-repository.sh

      - name: Run lifecycle tests
        run: ./tests/test-lifecycle.sh
