name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate public repository
        run: ./tests/test-repository.sh

      - name: Run lifecycle tests
        run: ./tests/test-lifecycle.sh

      - name: Run Region Relay Alexa runner tests
        run: ./tests/test-opsy-runner.sh

      - name: Run Region Relay Alexa Python tests
        run: python3 -m unittest discover -s opsy/skill/tests -v
